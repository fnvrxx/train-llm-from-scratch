[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "small-story-llm"
version = "0.1.0"
description = "Laboratorium Small LLM untuk cerita pendek Indonesia dan eksperimen sparsity"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.2"]

[tool.setuptools]
packages = ["small_llm"]

